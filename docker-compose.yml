services:
  # 1. CPS-i40 Node.js Backend & WebApp
  cps-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/alexmuellerit3/industrie-4.0-ar-mockup:latest
    container_name: cps-i40-backend
    restart: unless-stopped
    ports:
      # Beliebiger Port: Host-Port (${HOST_PORT:-${PORT:-80}}) auf Container-Port (${CONTAINER_PORT:-${PORT:-80}})
      - "${HOST_PORT:-${PORT:-80}}:${CONTAINER_PORT:-${PORT:-80}}"
    environment:
      - PORT=${CONTAINER_PORT:-${PORT:-80}}
      - NODE_ENV=production
      - MQTT_BROKER_URL=mqtt://mqtt-broker:1883
      - ENABLE_WSS=${ENABLE_WSS:-false}
      - MYSQL_HOST=${MYSQL_HOST:-cps-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cps_telemetry}
      - MYSQL_USER=${MYSQL_USER:-cps_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cps_pass_2026}
    volumes:
      - ./config:/app/config
    depends_on:
      - mqtt-broker
      - cps-mysql
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CONTAINER_PORT:-${PORT:-80}}/health || wget -qO- http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 2. Eclipse Mosquitto MQTT Broker
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: cps-i40-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # 3. MySQL 8.0 24h-Langzeitarchiv & Zabbix-Metadaten
  cps-mysql:
    image: mysql:8.0
    container_name: cps-i40-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_cps_2026}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cps_telemetry}
      - MYSQL_USER=${MYSQL_USER:-cps_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cps_pass_2026}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 4. Watchtower: Automatisches Pullen & Live-Aktualisierung
  watchtower:
    image: containrrr/watchtower:latest
    container_name: cps-i40-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_LABEL_ENABLE=true

volumes:
  mosquitto-data:
  mosquitto-log:
  mysql-data:
