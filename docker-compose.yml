services:
  # 1. CPS-i40 Node.js Backend & WebApp
  cps-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/alexmuellerit3/industrie-4.0-ar-mockup:latest
    container_name: cps-i40-backend
    restart: unless-stopped
    ports:
      # Beliebiger Port: Host-Port (${HOST_PORT:-${PORT:-80}}) auf Container-Port (${CONTAINER_PORT:-${PORT:-80}})
      - "${HOST_PORT:-${PORT:-80}}:${CONTAINER_PORT:-${PORT:-80}}"
    environment:
      - PORT=${CONTAINER_PORT:-${PORT:-80}}
      - NODE_ENV=production
      - MQTT_BROKER_URL=mqtt://mqtt-broker:1883
      - ENABLE_WSS=${ENABLE_WSS:-false}
    volumes:
      - ./config:/app/config
    depends_on:
      - mqtt-broker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CONTAINER_PORT:-${PORT:-80}}/health || wget -qO- http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 2. Eclipse Mosquitto MQTT Broker
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: cps-i40-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
