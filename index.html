<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CPS-i40 AR | Bonbon-Fertigung</title>

  <!-- A-Frame 1.4.0 & AR.js 3.4.5 -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

  <style>
    /* ==========================================================================
       Schlankes, funktional-industrielles Minimal-Layout
       Keine Überladung, Fokus auf Kamera und zentrale Messwerte
       ========================================================================== */
    :root {
      --bg-panel: rgba(22, 27, 38, 0.88);
      --border-panel: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --status-ok: #22c55e;
      --status-fault: #ef4444;
      --safe-top: env(safe-area-inset-top, 12px);
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: var(--text-main);
      touch-action: manipulation;
    }

    /* AR Kamera-Stream im Vollbild */
    video, canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    /* UI Viewport */
    .ar-hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 8px) 14px calc(var(--safe-bottom) + 8px) 14px;
    }

    .interactive {
      pointer-events: auto;
    }

    /* 1. Schlanke Kopfleiste (Einzeilig, dezent) */
    .hud-header {
      align-self: center;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-panel);
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-ok);
    }

    .header-text {
      color: var(--text-sub);
    }

    .header-text strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* 2. Dezenter Marker-Sucher (Nur sichtbar wenn kein Marker da ist) */
    .hud-scanner-hint {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s ease;
    }

    .scanner-bracket {
      width: 130px;
      height: 130px;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
    }

    .scanner-label {
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-sub);
    }

    /* 3. Schlankes Bottom-Panel (Erscheint bei Marker-Erkennung) */
    .hud-panel {
      display: none;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      width: 100%;
      align-self: center;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Kopfzeile der Karte */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .station-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .station-status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.2);
      color: var(--status-ok);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .station-status-pill.alarm {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border-color: var(--status-fault);
    }

    /* Messwerte (Schlanke 3 Spalten) */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .metric-col {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 6px 4px;
    }

    .metric-col.alert {
      border-color: var(--status-fault);
      background: rgba(239, 68, 68, 0.18);
    }

    .m-label {
      display: block;
      font-size: 9px;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .m-value {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .m-unit {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-sub);
    }

    /* Störungshinweis (nur bei Klick auf Störung) */
    .fault-notice {
      display: none;
      margin-top: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--status-fault);
      font-size: 10px;
      color: #fca5a5;
      text-align: center;
    }

    /* Schlanke Schaltflächen */
    .panel-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .btn-slim {
      flex: 1;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .btn-slim:active {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-fault {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Kleiner Schalter für Desktop-Präsentation ohne Marker */
    .desktop-sim {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 6px);
      right: 14px;
      z-index: 20;
      font-size: 10px;
      color: var(--text-sub);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 3px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       AR Szene: 3D Bonbon-Dose & kompaktes Schild über dem Hiro-Marker
       ======================================================================== -->
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    embedded
    arjs="sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    
    <a-marker preset="hiro" id="hiro-marker" smooth="true" smoothCount="4">
      
      <!-- 3D Bonbon-Dose -->
      <a-entity position="0 0.3 0">
        <a-cylinder
          id="ar-tin-cylinder"
          radius="0.4"
          height="0.55"
          color="#94a3b8"
          material="metalness: 0.7; roughness: 0.35">
        </a-cylinder>
        <a-cylinder
          position="0 0.28 0"
          radius="0.415"
          height="0.03"
          color="#cbd5e1"
          material="metalness: 0.8; roughness: 0.3">
        </a-cylinder>
      </a-entity>

      <!-- Kompaktes 3D Daten-Schild über der Dose -->
      <a-entity position="0 0.85 0" look-at="[camera]">
        <a-plane width="1.2" height="0.25" color="#161b26" material="opacity: 0.9; transparent: true"></a-plane>
        <a-text
          id="ar-3d-name"
          value="MODUL 2: BEFUELLUNG"
          align="center"
          position="0 0.04 0.01"
          scale="0.55 0.55 0.55"
          color="#ffffff">
        </a-text>
        <a-text
          id="ar-3d-val"
          value="250.3 g  |  5.2 bar"
          align="center"
          position="0 -0.05 0.01"
          scale="0.45 0.45 0.45"
          color="#22c55e">
        </a-text>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- ========================================================================
       Schlanke Smartphone-Benutzeroberfläche
       ======================================================================== -->
  <div class="ar-hud">
    
    <!-- Oben: Schlanker System-Status -->
    <header class="hud-header interactive">
      <span class="status-dot" id="status-dot"></span>
      <span class="header-text">CPS-i40 Bonbon-Linie • <strong id="header-status">Online (S7-1500)</strong></span>
    </header>

    <!-- Mitte: Schlanker Marker-Hinweis (wenn Marker nicht sichtbar) -->
    <div class="hud-scanner-hint interactive" id="scanner-hint">
      <div class="scanner-bracket"></div>
      <div class="scanner-label">Marker an Station anvisieren</div>
    </div>

    <!-- Unten: Aufgeräumte Telemetrie-Karte -->
    <main class="hud-panel interactive" id="hud-panel">
      
      <div class="panel-header">
        <span class="station-name" id="st-name">Modul 2: Dosier- & Befüllstation</span>
        <span class="station-status-pill" id="st-badge">NORMAL</span>
      </div>

      <!-- 3 Kernwerte -->
      <div class="metrics-row">
        <div class="metric-col" id="col-k1">
          <span class="m-label" id="k1-lbl">Füllgewicht</span>
          <span class="m-value" id="k1-v">250.3</span> <span class="m-unit" id="k1-u">g</span>
        </div>
        <div class="metric-col" id="col-k2">
          <span class="m-label" id="k2-lbl">Druck</span>
          <span class="m-value" id="k2-v">5.2</span> <span class="m-unit" id="k2-u">bar</span>
        </div>
        <div class="metric-col" id="col-k3">
          <span class="m-label" id="k3-lbl">Takt</span>
          <span class="m-value" id="k3-v">32</span> <span class="m-unit" id="k3-u">D/min</span>
        </div>
      </div>

      <!-- Störungs-Hinweis (erscheint nur bei Klick) -->
      <div class="fault-notice" id="fault-notice">
        ⚠️ Druckabfall an Station! Pneumatikzuleitung prüfen.
      </div>

      <!-- Schlanke Buttons -->
      <div class="panel-actions">
        <button class="btn-slim" id="btn-next">Modul wechseln (1–4)</button>
        <button class="btn-slim btn-fault" id="btn-fault">Störung simulieren</button>
      </div>

    </main>

  </div>

  <!-- Kleiner Desktop-Helfer -->
  <div class="desktop-sim interactive" id="btn-desktop-sim">Sim: Kamera</div>

  <!-- Logik -->
  <script>
    // 4 Fertigungsmodule mit je 3 Kernwerten
    const modules = [
      {
        name: "Modul 1: Dosen-Zuführung",
        k1: { label: "Magazin", val: 84, unit: "%", min: 82, max: 86 },
        k2: { label: "Vakuum", val: -0.8, unit: "bar", min: -0.85, max: -0.78 },
        k3: { label: "Zähler", val: 1684, unit: "Stk", isFixed: true }
      },
      {
        name: "Modul 2: Dosier- & Befüllstation",
        k1: { label: "Füllgewicht", val: 250.3, unit: "g", min: 249.7, max: 250.6 },
        k2: { label: "Druck", val: 5.2, unit: "bar", min: 5.1, max: 5.3 },
        k3: { label: "Takt", val: 32, unit: "D/min", min: 31, max: 33 }
      },
      {
        name: "Modul 3: Verschluss & Bördelung",
        k1: { label: "Anpressdruck", val: 5.2, unit: "bar", min: 5.1, max: 5.3 },
        k2: { label: "Drehmoment", val: 3.9, unit: "Nm", min: 3.8, max: 4.1 },
        k3: { label: "Prüfung", val: 100, unit: "% OK", isFixed: true }
      },
      {
        name: "Modul 4: Qualitätskontrolle & Waage",
        k1: { label: "Kontrollgewicht", val: 250.1, unit: "g", min: 249.8, max: 250.4 },
        k2: { label: "Ausschuss", val: 0.4, unit: "%", min: 0.3, max: 0.5 },
        k3: { label: "OEE", val: 93, unit: "%", isFixed: true }
      }
    ];

    let currentIdx = 1; // Standard: Modul 2
    let isMarkerVisible = false;
    let isSimMode = false;
    let isFaultActive = false;

    // DOM
    const hiroMarker = document.getElementById('hiro-marker');
    const scannerHint = document.getElementById('scanner-hint');
    const hudPanel = document.getElementById('hud-panel');
    const stName = document.getElementById('st-name');
    const stBadge = document.getElementById('st-badge');
    const faultNotice = document.getElementById('fault-notice');
    const btnNext = document.getElementById('btn-next');
    const btnFault = document.getElementById('btn-fault');
    const btnDesktopSim = document.getElementById('btn-desktop-sim');
    const statusDot = document.getElementById('status-dot');

    // 3D
    const arTinCylinder = document.getElementById('ar-tin-cylinder');
    const ar3dName = document.getElementById('ar-3d-name');
    const ar3dVal = document.getElementById('ar-3d-val');

    function renderView(idx) {
      const m = modules[idx];
      stName.textContent = m.name;

      if (isFaultActive) {
        stBadge.textContent = "STÖRUNG";
        stBadge.className = "station-status-pill alarm";
        faultNotice.style.display = 'block';
        statusDot.style.background = 'var(--status-fault)';

        // 3D
        if (arTinCylinder) arTinCylinder.setAttribute('color', '#ef4444');
        if (ar3dName) ar3dName.setAttribute('value', 'STÖRUNG: DRUCKABFALL');
        if (ar3dVal) {
          ar3dVal.setAttribute('value', '2.8 bar [KRITISCH]');
          ar3dVal.setAttribute('color', '#fca5a5');
        }

        document.getElementById('col-k2').classList.add('alert');
        document.getElementById('k2-v').textContent = "2.8";
      } else {
        stBadge.textContent = "NORMAL";
        stBadge.className = "station-status-pill";
        faultNotice.style.display = 'none';
        statusDot.style.background = 'var(--status-ok)';

        // 3D
        if (arTinCylinder) arTinCylinder.setAttribute('color', '#94a3b8');
        if (ar3dName) ar3dName.setAttribute('value', m.name.toUpperCase());
        if (ar3dVal) {
          ar3dVal.setAttribute('value', `${m.k1.val} ${m.k1.unit}  |  ${m.k2.val} ${m.k2.unit}`);
          ar3dVal.setAttribute('color', '#22c55e');
        }

        document.getElementById('col-k2').classList.remove('alert');
      }

      // K1
      document.getElementById('k1-lbl').textContent = m.k1.label;
      document.getElementById('k1-v').textContent = m.k1.val;
      document.getElementById('k1-u').textContent = m.k1.unit;

      // K2
      document.getElementById('k2-lbl').textContent = m.k2.label;
      if (!isFaultActive) document.getElementById('k2-v').textContent = m.k2.val;
      document.getElementById('k2-u').textContent = m.k2.unit;

      // K3
      document.getElementById('k3-lbl').textContent = m.k3.label;
      document.getElementById('k3-v').textContent = m.k3.val;
      document.getElementById('k3-u').textContent = m.k3.unit;
    }

    // Leichte Messwert-Fluktuation alle 1.5s
    setInterval(() => {
      if ((isMarkerVisible || isSimMode) && !isFaultActive) {
        const m = modules[currentIdx];
        ['k1', 'k2', 'k3'].forEach(k => {
          const item = m[k];
          if (!item.isFixed) {
            const delta = (Math.random() - 0.5) * 0.1;
            let val = +(item.val + delta).toFixed(1);
            if (val >= item.min && val <= item.max) item.val = val;
          }
        });
        renderView(currentIdx);
      }
    }, 1500);

    // Modul wechseln
    btnNext.addEventListener('click', () => {
      currentIdx = (currentIdx + 1) % modules.length;
      renderView(currentIdx);
    });

    // Störung umschalten
    btnFault.addEventListener('click', () => {
      isFaultActive = !isFaultActive;
      btnFault.textContent = isFaultActive ? "Störung beheben" : "Störung simulieren";
      renderView(currentIdx);
    });

    // Marker Events
    hiroMarker.addEventListener('markerFound', () => {
      isMarkerVisible = true;
      scannerHint.style.opacity = '0';
      hudPanel.style.display = 'block';
      renderView(currentIdx);
    });

    hiroMarker.addEventListener('markerLost', () => {
      isMarkerVisible = false;
      if (!isSimMode) {
        scannerHint.style.opacity = '1';
        hudPanel.style.display = 'none';
      }
    });

    // Desktop Testmodus
    btnDesktopSim.addEventListener('click', () => {
      isSimMode = !isSimMode;
      btnDesktopSim.textContent = isSimMode ? "Sim: AN" : "Sim: Kamera";
      if (isSimMode) {
        scannerHint.style.opacity = '0';
        hudPanel.style.display = 'block';
        renderView(currentIdx);
      } else if (!isMarkerVisible) {
        scannerHint.style.opacity = '1';
        hudPanel.style.display = 'none';
      }
    });

    // Init
    renderView(currentIdx);

    window.fireEventMarkerFound = () => hiroMarker.dispatchEvent(new CustomEvent('markerFound'));
    window.fireEventMarkerLost = () => hiroMarker.dispatchEvent(new CustomEvent('markerLost'));
  </script>
</body>
</html>
