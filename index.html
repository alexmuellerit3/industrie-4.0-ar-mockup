<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#12141a">
  <title>CPS-i40 AR Telemetrie</title>

  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- A-Frame 1.4.0 & AR.js 3.4.5 -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
</head>
<body>

  <!-- ========================================================================
       AR Szene: Hiro Marker & 3D Industriemodell
       ======================================================================== -->
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true"
    embedded
    arjs="sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    
    <a-marker preset="hiro" id="hiro-marker" smooth="true" smoothCount="4">
      
      <!-- Bodenrahmen (Passmarke) -->
      <a-entity position="0 0.01 0" rotation="-90 0 0">
        <a-plane width="1.1" height="1.1" color="#181a20" material="opacity: 0.4; transparent: true"></a-plane>
      </a-entity>

      <!-- 3D-Bonbon-Dose (Edelstahl / Titan) -->
      <a-entity position="0 0.28 0">
        <a-cylinder
          id="tin-body"
          radius="0.4"
          height="0.52"
          color="#a1a1aa"
          material="metalness: 0.85; roughness: 0.25">
        </a-cylinder>
        <a-cylinder
          position="0 0.265 0"
          radius="0.415"
          height="0.03"
          color="#d4d4d8"
          material="metalness: 0.9; roughness: 0.2">
        </a-cylinder>
      </a-entity>

      <!-- 3D-Typenschild über dem Marker -->
      <a-entity position="0 0.82 0" look-at="[camera]">
        <a-plane width="1.2" height="0.26" color="#161920" material="opacity: 0.95; transparent: true"></a-plane>
        <a-text
          id="ar-text-title"
          value="MODUL 2: BEFUELLUNG"
          align="center"
          position="0 0.04 0.01"
          scale="0.55 0.55 0.55"
          color="#ffffff">
        </a-text>
        <a-text
          id="ar-text-data"
          value="250.3 g  |  5.2 bar"
          align="center"
          position="0 -0.05 0.01"
          scale="0.45 0.45 0.45"
          color="#86efac">
        </a-text>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- ========================================================================
       Schlanke HMI-Benutzeroberfläche
       ======================================================================== -->
  <div class="ar-frame">
    
    <!-- Status-Leiste oben -->
    <header class="top-indicator interactive">
      <span class="status-dot" id="status-dot"></span>
      <span>CPS-i40 • <strong>Bonbon-Fertigung</strong></span>
    </header>

    <!-- Fadenkreuz (nur bei Markersuche) -->
    <div class="viewfinder interactive" id="viewfinder">
      <div class="viewfinder-box">
        <div class="viewfinder-corner c-tl"></div>
        <div class="viewfinder-corner c-tr"></div>
        <div class="viewfinder-corner c-bl"></div>
        <div class="viewfinder-corner c-br"></div>
      </div>
      <div class="viewfinder-label">Marker ausrichten</div>
    </div>

    <!-- Stationskarte unten (nur bei erkanntem Marker) -->
    <main class="station-card interactive" id="station-card">
      
      <div class="station-head">
        <div class="station-title" id="st-name">Modul 2: Dosierung & Befüllung</div>
        <div class="station-status-tag" id="st-tag">NORMAL</div>
      </div>

      <!-- 3 Kernwerte -->
      <div class="sensor-row">
        <div class="sensor-item" id="cell-v1">
          <span class="sensor-name" id="v1-lbl">Füllgewicht</span>
          <div class="sensor-value"><span id="v1-val">250.3</span> <span class="sensor-unit" id="v1-unit">g</span></div>
        </div>
        <div class="sensor-item" id="cell-v2">
          <span class="sensor-name" id="v2-lbl">Druck</span>
          <div class="sensor-value"><span id="v2-val">5.2</span> <span class="sensor-unit" id="v2-unit">bar</span></div>
        </div>
        <div class="sensor-item" id="cell-v3">
          <span class="sensor-name" id="v3-lbl">Takt</span>
          <div class="sensor-value"><span id="v3-val">32</span> <span class="sensor-unit" id="v3-unit">D/min</span></div>
        </div>
      </div>

      <!-- Störungsmeldung -->
      <div class="alert-strip" id="alert-strip">
        Störung: Pneumatik-Druckabfall (< 4.5 bar)
      </div>

      <!-- Aktionen -->
      <div class="card-actions">
        <button class="btn-action" id="btn-next">Station wechseln</button>
        <button class="btn-action btn-fault" id="btn-fault">Störung simulieren</button>
      </div>

    </main>

  </div>

  <!-- Sim-Schalter für Desktop -->
  <div class="sim-toggle interactive" id="btn-sim">Sim: Kamera</div>

  <!-- Modular WebApp Application Entry -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
