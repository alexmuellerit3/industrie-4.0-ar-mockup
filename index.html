<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Industrie 4.0 AR Mockup - Testpage</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    #overlay {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      -webkit-transform: translate(-50%, -50%);
      z-index: 10;
      min-width: 220px;
      max-width: 90vw;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 16px;
      text-align: center;
      color: #fff;
      pointer-events: auto;
    }

    /* Kamera-/Canvas-Darstellung auf Smartphones optimiert */
    video, canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
    }
  </style>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    embedded
    arjs="sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    <a-marker preset="hiro" id="hiro-marker"></a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <div id="overlay">
    <div id="marker-count">Times the Marker was found: 0</div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const hiroMarker = document.getElementById('hiro-marker');
    const markerCount = document.getElementById('marker-count');
    let markerFoundCount = 0;

    hiroMarker.addEventListener('markerFound', () => {
      console.debug('Marker found');
      markerFoundCount += 1;
      markerCount.textContent = `Times the Marker was found: ${markerFoundCount}`;
      overlay.style.display = 'block';
    });

    hiroMarker.addEventListener('markerLost', () => {
      console.debug('Marker lost');
      overlay.style.display = 'none';
    });

    /* global functions for debugging */
    window.fireEventMarkerFound = () => {
      const event = new CustomEvent('markerFound');
      hiroMarker.dispatchEvent(event);
    }

    window.fireEventMarkerLost = () => {
      const event = new CustomEvent('markerLost');
      hiroMarker.dispatchEvent(event);
    }
  </script>
</body>
</html>
