# ==============================================================================
# Mosquitto MQTT Broker Konfiguration für CPS-i40 Industrie 4.0
# ==============================================================================

# Standard MQTT Port für SPS / Edge-Gateways (IOT2050 / Node-RED)
listener 1883
allow_anonymous true

# WebSockets Port für direkte Browser-MQTT Verbindungen
listener 9001
protocol websockets
allow_anonymous true

# Daten-Persistenz
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
